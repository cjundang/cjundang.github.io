<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dr. Chanankorn Jandaeng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .section-title {
        font-weight: 600;
        border-bottom: 3px solid #0d6efd;
        display: inline-block;
        padding-bottom: 4px;
        margin-bottom: 12px;
      }

      .course-link {
        text-decoration: none;
        color: #212529;
      }

      .course-link:hover {
        text-decoration: underline;
      }

      .link-icon {
        font-size: 0.85em;
        color: #0d6efd;
        margin-left: 6px;
      }

      #btnMorePubs {
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <span class="navbar-brand">Dr. Chanankorn Jandaeng</span>
  </div>
</nav>

<!-- HERO -->
<section class="py-5 text-center bg-light">
  <div class="container">
    <h1 id="fullName" class="fw-bold"></h1>
    <h5 class="text-muted" id="position"></h5>
    <p id="affiliation"></p>
  </div>
</section>

<!-- MAIN LAYOUT -->
<section class="container my-5">
  <div class="row g-4">

    <!-- LEFT SIDEBAR -->
    <aside class="col-md-4">

      <!-- About -->
      <div class="mb-4">
        <h5 class="section-title">About Me</h5>
        <p id="aboutText"></p>
        <p id="researchFocus" class="mt-2 fst-italic text-muted" style="font-size:0.9rem;"></p>
      </div>

      <!-- Courses -->
      <div class="mb-4">
        <h5 class="section-title">Courses</h5><br/>
        <strong>Current Courses</strong>
        <ul id="currentCourses" class="list-unstyled mt-2"></ul>

        <strong class="mt-3 d-block">Previous Courses</strong>
        <ul id="previousCourses" class="list-unstyled mt-2"></ul>
      </div>

      <!-- Education -->
      <div class="mb-4">
        <h5 class="section-title">Education</h5>
        <ul id="educationList" class="list-unstyled"></ul>
      </div>

      <!-- Experience -->
      <div class="mb-4">
        <h5 class="section-title">Experience</h5>
        <ul id="experienceList" class="list-unstyled"></ul>
      </div>

    </aside>

    <!-- RIGHT CONTENT -->
    <main class="col-md-8">
      <h3 class="section-title">Research Publications</h3>
      <ol id="publicationList" class="mt-4"></ol>
      <div id="morePubsSection" class="mt-2" style="display:none;">
        <ol id="publicationListMore" style="display:none;"></ol>
        <button id="btnMorePubs" class="btn btn-outline-primary btn-sm" onclick="toggleMorePubs()">
          <i class="bi bi-chevron-down me-1"></i> Show more
        </button>
      </div>
    </main>

  </div>
</section>

<!-- FOOTER -->
<footer class="text-center py-3 text-muted">
  © 2024 Dr. Chanankorn Jandaeng. All Rights Reserved.
</footer>

<script src="script.js"></script>
</body>
</html>
